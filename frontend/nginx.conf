server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # T45: o nginx:alpine vem com gzip desligado; sem isto o bundle inicial
    # trafegava cru (~495 KB em vez de ~150 KB). Imagens ja comprimidas
    # (jpg/png/woff2) ficam de fora.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml text/plain;

    # Assets do Vite tem hash no nome: o conteudo de um nome nunca muda, entao
    # podem ficar no cache do navegador sem revalidar.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html sempre revalidado: e ele que aponta para os assets do deploy atual.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
