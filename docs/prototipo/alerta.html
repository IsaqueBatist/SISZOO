<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<title>SISZOO — Detalhe de Alerta</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Manrope:wght@400;500;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/tokens.css">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/components.css">
<style>
  .alert-hero {
    border-radius: var(--radius-lg);
    padding: 24px 28px;
    display: flex; align-items: flex-start; gap: 18px;
    border: 1px solid var(--color-border);
    background: var(--color-surface);
  }
  .alert-hero.danger { background: linear-gradient(135deg, var(--color-danger-bg) 0%, #FFCDD2 100%); border-color: #EF9A9A; }
  .alert-hero.warning { background: linear-gradient(135deg, var(--color-warning-bg) 0%, #FFE0B2 100%); border-color: #FFCC80; }
  .alert-hero.info { background: linear-gradient(135deg, var(--color-info-bg) 0%, #BBDEFB 100%); border-color: #90CAF9; }
  .alert-hero.yellow { background: linear-gradient(135deg, #FFF8E1 0%, #FFECB3 100%); border-color: #FFE082; }
  .alert-hero .ah-ico {
    width: 56px; height: 56px;
    border-radius: 14px;
    background: rgba(255,255,255,0.6);
    display: inline-flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .alert-hero h1 { font-size: 24px; margin-bottom: 4px; }
  .alert-hero p { font-size: 14px; color: var(--color-text-secondary); }
  .alert-hero .ah-kpis { display: flex; gap: 24px; margin-top: 16px; }
  .alert-hero .ah-kpi { font-size: 13px; }
  .alert-hero .ah-kpi .v { font-family: var(--font-display); font-weight: 700; font-size: 22px; display: block; }
  .alert-hero .ah-kpi .l { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--color-text-secondary); }
</style>
</head>
<body data-page="dashboard">
<div data-shell-root>

  <div class="page-header">
    <div class="title-block">
      <a href="dashboard.html" class="btn btn-ghost btn-sm" style="align-self: flex-start;">← Voltar para Dashboard</a>
      <h1 id="alert-title">Detalhe de Alerta</h1>
      <p class="subtitle" id="alert-subtitle">Carregando...</p>
    </div>
    <div class="actions">
      <button class="btn btn-outline btn-sm"><span id="ic-dl"></span>Exportar lista</button>
      <button class="btn btn-primary btn-sm" id="ic-act">Tomar providências</button>
    </div>
  </div>

  <div id="alert-hero-host"></div>

  <div class="card" style="margin-top: var(--space-4);">
    <div class="card-header">
      <h3 id="list-title">Animais afetados</h3>
      <span class="sub" id="list-sub">Clique no nome do animal para abrir a ficha</span>
    </div>
    <div class="card-body" style="padding: 0;">
      <table class="data" id="alert-table">
        <thead id="alert-thead"></thead>
        <tbody id="alert-tbody"></tbody>
      </table>
    </div>
  </div>

</div>

<script src="assets/icons.js"></script>
<script src="assets/shell.js"></script>
<script src="assets/tweaks.js"></script>

  const data = ALERTS[tipo] || ALERTS.vacinas;
  document.getElementById('alert-title').textContent = data.title;
  document.getElementById('alert-subtitle').textContent = data.subtitle;

  // Render hero
  const heroIcon = I[data.icon] ? I[data.icon](28) : I.alert(28);
  const kpisHtml = data.kpis.map(k => `
    <div class="ah-kpi">
      <span class="v">${k.v}</span>
      <span class="l">${k.l}</span>
    </div>
  `).join('');
  document.getElementById('alert-hero-host').innerHTML = `
    <div class="alert-hero ${data.hero}">
      <div class="ah-ico" style="color: var(--color-${data.hero === 'yellow' ? 'warning' : data.hero});">${heroIcon}</div>
      <div>
        <h1>${data.title}</h1>
        <p>${data.subtitle}</p>
        <div class="ah-kpis">${kpisHtml}</div>
      </div>
    </div>
  `;

  // Render table
  document.getElementById('alert-thead').innerHTML = `<tr>${data.cols.map(c => `<th>${c}</th>`).join('')}</tr>`;
  document.getElementById('alert-tbody').innerHTML = data.rows.map(r => {
    const cells = r.map((cell, i) => {
      if (i === 0) {
        return `<td><a href="animal.html" style="font-weight: 600; color: var(--color-primary);">${cell}</a></td>`;
      }
      return `<td>${cell}</td>`;
    }).join('');
    return `<tr>${cells}</tr>`;
  }).join('');
</script>
</body>
</html>
