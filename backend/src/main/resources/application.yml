spring:
  application:
    name: siszoo-backend
  # Anexos de ocorrencia (T25): ate 5 MB por arquivo, um arquivo por requisicao.
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  # Sem hibernate.jdbc.time_zone, de proposito: as datas de negocio sao
  # LocalDate/LocalDateTime em colunas `date`/`timestamp` sem fuso, e a
  # propriedade fazia o Hibernate converter o LocalDateTime pelo fuso da JVM
  # ao gravar (09:30 virava 06:30 com a JVM em UTC). O fuso do sistema e
  # fixado na JVM (SiszooBackendApplication, TZ do Dockerfile) e no Clock
  # (ClockConfig). Ver FusoHorarioPersistenciaIT.
  # SMTP do EmailService (T35; usado pela notificacao de resultado positivo
  # da T37). Sem SMTP real configurado, o envio falha ao conectar: a falha
  # so e logada pelo EmailService e nunca bloqueia quem chamou. Timeouts
  # curtos para a thread assincrona nao ficar presa. Variaveis e sandbox de
  # desenvolvimento: docs/email.md.
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:25}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:false}
          starttls:
            enable: ${SMTP_STARTTLS:false}
            # true recusa a sessao se o servidor nao aceitar STARTTLS, em vez
            # de seguir em texto claro (o Angus tenta o STARTTLS so com isso).
            required: ${SMTP_STARTTLS_REQUIRED:false}
          # SMTPS (TLS implicito desde a conexao, tipicamente porta 465):
          # SMTP_SSL=true com SMTP_PORT=465; as SMTP_STARTTLS* nao se aplicam.
          # O certificado do servidor e validado (cadeia e nome do host).
          ssl:
            enable: ${SMTP_SSL:false}
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
  # Executor do @EnableAsync (AsyncConfig): o applicationTaskExecutor do
  # Boot. Prefixo para identificar as threads no log; no encerramento
  # normal, espera os envios em curso (ate 3 timeouts SMTP de 5 s).
  task:
    execution:
      thread-name-prefix: siszoo-async-
      shutdown:
        await-termination: true
        await-termination-period: 20s
  # Cache das agregacoes do dashboard (com.siszoo.relatorios, T38): TTL curto
  # para nao recalcular a cada refresh/polling em maquinas com ~2GB RAM. Sem
  # @CacheEvict — ver docs/contratos/dashboard-kpis.md para o atraso que isso
  # pode introduzir. Desligado no perfil de teste (abaixo).
  cache:
    cache-names: dashboardKpis, dashboardGraficos
    caffeine:
      spec: expireAfterWrite=5m,maximumSize=10

# T45: o navegador chama a API direto (VITE_API_BASE_URL, sem o nginx no
# meio), e as respostas JSON trafegavam sem compressao. So JSON e so a partir
# de 1 KB (respostas pequenas nao compensam). BREACH (compressao + TLS) exige
# segredo e texto escolhido pelo atacante na mesma resposta: o unico segredo
# no corpo e o token do login, cuja resposta (token + usuario) fica abaixo de
# 1 KB e, com e-mail/senha forjados pelo atacante, e 401 sem token; a API nao
# usa cookie. Reavaliar se algum desses pontos mudar.
server:
  compression:
    enabled: true
    mime-types: application/json
    min-response-size: 1KB

siszoo:
  cors:
    allowed-origin: ${SISZOO_CORS_ORIGIN:http://localhost:5173}
  notificacoes:
    remetente: ${SISZOO_MAIL_FROM:nao-responda@itu.sp.gov.br}

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

siszoo:
  admin:
    email: ${ADMIN_SEED_EMAIL:}
    password: ${ADMIN_SEED_PASSWORD:}
  jwt:
    secret: ${JWT_SECRET:}
    expiracao-minutos: 60

---
# `prod` tem a mesma configuracao do `docker` (o docker-compose continua com
# `docker`). Os dois existem tambem para o seed de dados ficticios recusar a
# subida neles (com.siszoo.seed.SeedDevGuarda).
spring:
  config:
    activate:
      on-profile: "docker | prod"
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

siszoo:
  admin:
    email: ${ADMIN_SEED_EMAIL:}
    password: ${ADMIN_SEED_PASSWORD:}
  jwt:
    secret: ${JWT_SECRET:}
    expiracao-minutos: 60

---
spring:
  config:
    activate:
      on-profile: test
  # Os *IT compartilham um PostgreSQL (um database por contexto em cache,
  # TestcontainersConfiguration). O maximo do pool continua o padrao (10,
  # usado pelos testes de concorrencia); so as conexoes ociosas dos contextos
  # fora de uso sao devolvidas, para o servidor nao carregar ~120 backends
  # parados enquanto os testes de migracao rodam DDL.
  datasource:
    hikari:
      minimum-idle: 0
      idle-timeout: 10000 # ms (minimo aceito pelo Hikari)
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  # Fixo nos testes: um SMTP_* exportado na maquina nao vaza para a suite.
  # Nada escuta em 127.0.0.1:25 no CI; os testes que precisam de SMTP sobem
  # o GreenMail e sobrescrevem host/porta (EmailServiceIT).
  mail:
    host: 127.0.0.1
    port: 25
    username: ""
    password: ""
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
            required: false
          ssl:
            enable: false
  # Cache do dashboard desligado nos testes (T38): o banco de teste é
  # compartilhado entre métodos sem rollback (AbstractIntegrationTest), e um
  # TTL de 5 min faria um teste ler o resultado cacheado de outro.
  cache:
    type: none

siszoo:
  jwt:
    secret: chave-secreta-de-teste-determin-nao-usar-em-producao-1234567890
    expiracao-minutos: 60
  notificacoes:
    remetente: nao-responda@siszoo.test

---
# Seed de dados ficticios (com.siszoo.seed, docs/decisoes/seed-dev.md): so com
# `dev` ou `test` junto, nunca com `docker`/`prod` (a subida falha), e so cria
# dados com SISZOO_SEED_HABILITADO=true. Idempotente: reexecutar nao duplica.
spring:
  config:
    activate:
      on-profile: seed

siszoo:
  seed:
    habilitado: ${SISZOO_SEED_HABILITADO:false}
