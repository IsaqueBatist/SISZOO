spring:
  application:
    name: siszoo-backend
  web:
    locale: pt_BR
    locale-resolver: fixed
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:25}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:false}
          starttls:
            enable: ${SMTP_STARTTLS:false}
            required: ${SMTP_STARTTLS_REQUIRED:false}
          ssl:
            enable: ${SMTP_SSL:false}
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
  task:
    execution:
      thread-name-prefix: siszoo-async-
      shutdown:
        await-termination: true
        await-termination-period: 20s
  cache:
    cache-names: dashboardKpis, dashboardGraficos
    caffeine:
      spec: expireAfterWrite=5m,maximumSize=10

server:
  compression:
    enabled: true
    mime-types: application/json
    min-response-size: 1KB

siszoo:
  cors:
    allowed-origin: ${SISZOO_CORS_ORIGIN:http://localhost:5173}
  sessao:
    inatividade-minutos: 60
    rotacao-minutos: 5
    tolerancia-token-anterior-segundos: 60
    cookie-secure: ${SISZOO_COOKIE_SECURE:false}
    cookie-same-site: ${SISZOO_COOKIE_SAMESITE:Strict}
  notificacoes:
    remetente: ${SISZOO_MAIL_FROM:nao-responda@itu.sp.gov.br}
  app:
    url: ${SISZOO_APP_URL:${SISZOO_CORS_ORIGIN:http://localhost:5173}}
  login:
    limite:
      falhas-por-email: 5
      falhas-por-ip: 30
      janela-minutos: 15
  recuperacao-senha:
    validade-minutos: 30
    limite:
      solicitacoes-por-email: 3
      solicitacoes-por-ip: 10
      janela-solicitacoes-minutos: 60
      consumos-por-ip: 20
      janela-consumos-minutos: 15

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

siszoo:
  admin:
    email: ${ADMIN_SEED_EMAIL:}
    password: ${ADMIN_SEED_PASSWORD:}
  jwt:
    secret: ${JWT_SECRET:}
    expiracao-minutos: 15

---
spring:
  config:
    activate:
      on-profile: "docker | prod"
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

siszoo:
  admin:
    email: ${ADMIN_SEED_EMAIL:}
    password: ${ADMIN_SEED_PASSWORD:}
  jwt:
    secret: ${JWT_SECRET:}
    expiracao-minutos: 15

---
spring:
  config:
    activate:
      on-profile: test
  datasource:
    hikari:
      minimum-idle: 0
      idle-timeout: 10000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  mail:
    host: 127.0.0.1
    port: 25
    username: ""
    password: ""
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
            required: false
          ssl:
            enable: false
  cache:
    type: none

siszoo:
  jwt:
    secret: chave-secreta-de-teste-determin-nao-usar-em-producao-1234567890
    expiracao-minutos: 15
  notificacoes:
    remetente: nao-responda@siszoo.test
  login:
    limite:
      falhas-por-email: 1000
      falhas-por-ip: 100000
      janela-minutos: 15

---
spring:
  config:
    activate:
      on-profile: seed

siszoo:
  seed:
    habilitado: ${SISZOO_SEED_HABILITADO:false}
