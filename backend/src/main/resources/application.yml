spring:
  application:
    name: siszoo-backend

siszoo:
  cors:
    allowed-origin: ${SISZOO_CORS_ORIGIN:http://localhost:5173}

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

siszoo:
  admin:
    email: ${ADMIN_SEED_EMAIL:}
    password: ${ADMIN_SEED_PASSWORD:}
  jwt:
    secret: ${JWT_SECRET:}
    expiracao-minutos: 60

---
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

siszoo:
  admin:
    email: ${ADMIN_SEED_EMAIL:}
    password: ${ADMIN_SEED_PASSWORD:}
  jwt:
    secret: ${JWT_SECRET:}
    expiracao-minutos: 60

---
spring:
  config:
    activate:
      on-profile: test
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

siszoo:
  jwt:
    secret: chave-secreta-de-teste-determin-nao-usar-em-producao-1234567890
    expiracao-minutos: 60
