name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Verificar se o projeto Maven existe
        id: check
        run: |
          if [ -f "pom.xml" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::backend/pom.xml ainda não existe — job de backend pulado."
          fi

      - uses: actions/setup-java@v4
        if: steps.check.outputs.exists == 'true'
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Wrapper (Maven 3.9.16, o mesmo do Dockerfile) em vez do mvn do runner;
      # sem --update-snapshots, ja que nao ha dependencia SNAPSHOT. `sh mvnw`
      # nao depende do bit de execucao (hoje versionado: 100755).
      - name: mvnw verify
        if: steps.check.outputs.exists == 'true'
        run: sh mvnw --batch-mode verify

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build
