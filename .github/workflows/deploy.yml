name: Deploy

# Publica as imagens do backend e do frontend no GitHub Container Registry depois
# que o CI passa num push na main. A VM não recebe nada daqui: ela busca as
# imagens novas sozinha (deploy/atualizar.sh, via cron). Detalhes em docs/deploy.md.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  imagens:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - servico: backend
            build_args: ""
          - servico: frontend
            build_args: |
              VITE_API_BASE_URL=${{ vars.SISZOO_PUBLIC_URL || 'https://siszoo-tg.northcentralus.cloudapp.azure.com' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Nome e versão da imagem
        id: nome
        run: |
          echo "imagem=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/siszoo-${{ matrix.servico }}" >> "$GITHUB_OUTPUT"
          echo "versao=sha-$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          # Lê commit e data do checkout (o commit que passou no CI), não do evento workflow_run.
          context: git
          images: ${{ steps.nome.outputs.imagem }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.nome.outputs.versao }}

      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.servico }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ matrix.build_args }}
          cache-from: type=gha,scope=${{ matrix.servico }}
          cache-to: type=gha,mode=max,scope=${{ matrix.servico }}
