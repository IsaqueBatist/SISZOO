requestId: null
name: "Espécie, status, motivo de entrada e baia inexistentes retornam 422"
code: |-
  async function login(email, senha) {
    const res = await insomnia.send({
      url: '{{ _.base_url }}/api/auth/login',
      method: 'POST',
      headers: [{ name: 'Content-Type', value: 'application/json' }],
      body: { mimeType: 'application/json', text: JSON.stringify({ email, senha }) },
    });
    expect(res.status).to.equal(200);
    return JSON.parse(res.body).token;
  }

  function emailUnico(prefixo) {
    const sufixo = String(Date.now())
      .split('')
      .map((d) => String.fromCharCode(97 + Number(d)))
      .join('');
    return `${prefixo}.${sufixo}@itu.sp.gov.br`;
  }

  async function criarUsuario(adminToken, dados) {
    return insomnia.send({
      url: '{{ _.base_url }}/api/usuarios',
      method: 'POST',
      headers: [
        { name: 'Content-Type', value: 'application/json' },
        { name: 'Authorization', value: `Bearer ${adminToken}` },
      ],
      body: { mimeType: 'application/json', text: JSON.stringify(dados) },
    });
  }
  function animalValido(overrides) {
    return Object.assign(
      {
        nome: 'Animal Teste',
        especie: 'canino',
        sexo: 'macho',
        esterilizado: false,
        status: 'disponivel_adocao',
        motivoEntrada: 'recolhimento',
        dataEntrada: '2026-08-30T09:00:00',
      },
      overrides,
    );
  }

  async function criarAnimal(token, overrides) {
    return insomnia.send({
      url: '{{ _.base_url }}/api/animais',
      method: 'POST',
      headers: [
        { name: 'Content-Type', value: 'application/json' },
        { name: 'Authorization', value: `Bearer ${token}` },
      ],
      body: { mimeType: 'application/json', text: JSON.stringify(animalValido(overrides)) },
    });
  }

  const adminToken = await login('{{ _.admin_email }}', '{{ _.admin_password }}');

  // Controle: o payload base, sem nenhum catálogo inválido, é aceito. Assim
  // cada 422 abaixo só pode vir do catálogo que o caso troca.
  const base = await criarAnimal(adminToken, {});
  expect(base.status).to.equal(200);

  // Erro de catálogo é regra do serviço: mensagem própria e sem "campos"
  // (campos só aparece na validação de campo, ex.: obrigatório ausente).
  async function esperarCatalogoInvalido(overrides, mensagem) {
    const res = await criarAnimal(adminToken, overrides);
    expect(res.status).to.equal(422);
    const corpo = JSON.parse(res.body);
    expect(corpo.mensagem).to.equal(mensagem);
    expect(corpo.campos === undefined).to.equal(true);
  }

  await esperarCatalogoInvalido({ especie: 'especie-que-nao-existe' }, 'Especie informada nao existe');
  await esperarCatalogoInvalido({ status: 'status-que-nao-existe' }, 'Status informado nao existe');
  await esperarCatalogoInvalido({ motivoEntrada: 'motivo-que-nao-existe' }, 'Motivo de entrada informado nao existe');
  await esperarCatalogoInvalido({ baiaId: '00000000-0000-4000-8000-000000000099' }, 'Baia informada nao existe');

