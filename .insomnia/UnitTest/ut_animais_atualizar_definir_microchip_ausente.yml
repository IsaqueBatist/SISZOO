requestId: null
name: "Definir o microchip de um animal que ainda não tinha (primeira vez) é permitido"
code: |-
  async function login(email, senha) {
    const res = await insomnia.send({
      url: '{{ _.base_url }}/api/auth/login',
      method: 'POST',
      headers: [{ name: 'Content-Type', value: 'application/json' }],
      body: { mimeType: 'application/json', text: JSON.stringify({ email, senha }) },
    });
    expect(res.status).to.equal(200);
    return JSON.parse(res.body).token;
  }

  function emailUnico(prefixo) {
    const sufixo = String(Date.now())
      .split('')
      .map((d) => String.fromCharCode(97 + Number(d)))
      .join('');
    return `${prefixo}.${sufixo}@itu.sp.gov.br`;
  }

  async function criarUsuario(adminToken, dados) {
    return insomnia.send({
      url: '{{ _.base_url }}/api/usuarios',
      method: 'POST',
      headers: [
        { name: 'Content-Type', value: 'application/json' },
        { name: 'Authorization', value: `Bearer ${adminToken}` },
      ],
      body: { mimeType: 'application/json', text: JSON.stringify(dados) },
    });
  }
  function animalValido(overrides) {
    return Object.assign(
      {
        nome: 'Animal Teste',
        especie: 'canino',
        sexo: 'macho',
        // boolean primitivo no CriarAnimalRequest: sem ele o Jackson recusa o corpo (400).
        esterilizado: false,
        status: 'disponivel_adocao',
        motivoEntrada: 'recolhimento',
        dataEntrada: '2026-08-30T09:00:00',
      },
      overrides,
    );
  }

  async function criarAnimal(token, overrides) {
    return insomnia.send({
      url: '{{ _.base_url }}/api/animais',
      method: 'POST',
      headers: [
        { name: 'Content-Type', value: 'application/json' },
        { name: 'Authorization', value: `Bearer ${token}` },
      ],
      body: { mimeType: 'application/json', text: JSON.stringify(animalValido(overrides)) },
    });
  }

  const adminToken = await login('{{ _.admin_email }}', '{{ _.admin_password }}');

  const criar = await criarAnimal(adminToken, { nome: 'SemChip' });
  expect(criar.status).to.equal(200);
  expect(JSON.parse(criar.body).fichaCompleta).to.equal(false);
  const animalId = JSON.parse(criar.body).id;

  const novoMicrochip = `CHIP-${Date.now()}`;
  const atualizar = await insomnia.send({
    url: `{{ _.base_url }}/api/animais/${animalId}`,
    method: 'PUT',
    headers: [
      { name: 'Content-Type', value: 'application/json' },
      { name: 'Authorization', value: `Bearer ${adminToken}` },
    ],
    body: {
      mimeType: 'application/json',
      text: JSON.stringify(animalValido({ nome: 'SemChip', microchip: novoMicrochip })),
    },
  });
  expect(atualizar.status).to.equal(200);
  expect(JSON.parse(atualizar.body).microchip).to.equal(novoMicrochip);
  // Ficha completa = microchip + ao menos 1 vacinação (DER §3.2,
  // FichaCompletaService): só o microchip não basta.
  expect(JSON.parse(atualizar.body).fichaCompleta).to.equal(false);

  const vacinar = await insomnia.send({
    url: '{{ _.base_url }}/api/vacinacoes',
    method: 'POST',
    headers: [
      { name: 'Content-Type', value: 'application/json' },
      { name: 'Authorization', value: `Bearer ${adminToken}` },
    ],
    body: {
      mimeType: 'application/json',
      text: JSON.stringify({
        animalId,
        vacina: 'antirrabica',
        dataAplicacao: '2026-08-31',
        doseQuantidade: 1.0,
        doseUnidade: 'MILILITRO',
      }),
    },
  });
  expect(vacinar.status).to.equal(200);

  const buscar = await insomnia.send({
    url: `{{ _.base_url }}/api/animais/${animalId}`,
    method: 'GET',
    headers: [{ name: 'Authorization', value: `Bearer ${adminToken}` }],
  });
  expect(buscar.status).to.equal(200);
  expect(JSON.parse(buscar.body).fichaCompleta).to.equal(true);

