type: "UnitTest"
parentId: "uts_animais"
modified: 1750000000000
created: 1750000000000
requestId: null
name: "Agente Sanitário lê animais mas não cria (403); Veterinário lê e cria (200)"
code: |-
  async function login(email, senha) {
    const res = await insomnia.send({
      url: '{{ _.base_url }}/api/auth/login',
      method: 'POST',
      headers: [{ name: 'Content-Type', value: 'application/json' }],
      body: { mimeType: 'application/json', text: JSON.stringify({ email, senha }) },
    });
    expect(res.status).to.equal(200);
    return JSON.parse(res.body).token;
  }

  function emailUnico(prefixo) {
    const sufixo = String(Date.now())
      .split('')
      .map((d) => String.fromCharCode(97 + Number(d)))
      .join('');
    return `${prefixo}.${sufixo}@itu.sp.gov.br`;
  }

  async function criarUsuario(adminToken, dados) {
    return insomnia.send({
      url: '{{ _.base_url }}/api/usuarios',
      method: 'POST',
      headers: [
        { name: 'Content-Type', value: 'application/json' },
        { name: 'Authorization', value: `Bearer ${adminToken}` },
      ],
      body: { mimeType: 'application/json', text: JSON.stringify(dados) },
    });
  }
  function animalValido(overrides) {
    return Object.assign(
      {
        nome: 'Animal Teste',
        especie: 'canino',
        sexo: 'macho',
        status: 'disponivel_adocao',
        motivoEntrada: 'recolhimento',
        dataEntrada: '2026-08-30T09:00:00',
      },
      overrides,
    );
  }

  async function criarAnimal(token, overrides) {
    return insomnia.send({
      url: '{{ _.base_url }}/api/animais',
      method: 'POST',
      headers: [
        { name: 'Content-Type', value: 'application/json' },
        { name: 'Authorization', value: `Bearer ${token}` },
      ],
      body: { mimeType: 'application/json', text: JSON.stringify(animalValido(overrides)) },
    });
  }

  const adminToken = await login('{{ _.admin_email }}', '{{ _.admin_password }}');
  const senha = '{{ _.senha_teste_padrao }}';

  async function criarELogar(cargo, prefixo, crmv) {
    const email = emailUnico(prefixo);
    const dados = { nome: 'Rbac', sobrenome: cargo, email, cargo, senhaInicial: senha };
    if (crmv) dados.crmv = crmv;
    const criar = await criarUsuario(adminToken, dados);
    expect(criar.status).to.equal(200);
    return login(email, senha);
  }

  const tokenAgente = await criarELogar('Agente Sanitário', 'rbac.animais.agente');
  const tokenVeterinario = await criarELogar('Veterinário', 'rbac.animais.vet', 'CRMV-SP-0002');

  async function listarAnimais(token) {
    return insomnia.send({
      url: '{{ _.base_url }}/api/animais',
      method: 'GET',
      headers: [{ name: 'Authorization', value: `Bearer ${token}` }],
    });
  }

  expect((await listarAnimais(tokenAgente)).status).to.equal(200);
  expect((await criarAnimal(tokenAgente, { nome: 'NaoDeveriaCriar' })).status).to.equal(403);

  expect((await listarAnimais(tokenVeterinario)).status).to.equal(200);
  expect((await criarAnimal(tokenVeterinario, { nome: 'VetPodeCriar' })).status).to.equal(200);

