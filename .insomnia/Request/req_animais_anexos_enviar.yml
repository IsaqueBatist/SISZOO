      type: "file"
      fileName: "backend/src/main/resources/seed/fotos/001-thor.jpg"
    - id: "pair_req_animais_anexos_enviar_1"
      name: "descricao"
      value: "Foto de exemplo (CC0)"
      description: ''
parameters: []
headers:
