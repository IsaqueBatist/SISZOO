description: "Envia um arquivo (JPEG, PNG ou PDF, até 5 MB) para o animal {{ _.animal_id_exemplo }}. O campo \"arquivo\" aponta para uma foto CC0 do próprio repositório; se o Insomnia não localizar o caminho, selecione o arquivo de novo. Requer GESTAO_ANIMAIS:escrita."
method: "POST"
body:
  mimeType: "multipart/form-data"
  params:
    - id: "pair_req_animais_anexos_enviar_0"
      name: "arquivo"
