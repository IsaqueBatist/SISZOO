_id: "req_usuarios_criar"
type: "Request"
parentId: "fld_usuarios"
modified: 1750000000000
created: 1750000000000
url: "{{ _.base_url }}/api/usuarios"
name: "Criar usuário - caso feliz"
description: "Requer USUARIOS_ACESSO:escrita (só Administrador). O e-mail leva o sufixo da execução ({{ _.execucao_letras }}, gerado no login), então a sequência pode ser repetida. A regra de e-mail único (409) é demonstrada pela suíte ut_usuarios_criar_409_email_duplicado. O id fica em {{ _.usuario_id_exemplo }}."
method: "POST"
body:
  mimeType: "application/json"
  text: |-
    {
      "nome": "Ana",
      "sobrenome": "Exemplo",
      "email": "ana.{{ _.execucao_letras }}@itu.sp.gov.br",
      "cargo": "Agente Sanitário",
      "telefone": "(11) 99999-0000",
      "senhaInicial": "{{ _.senha_teste_padrao }}"
    }
parameters: []
headers:
  - name: "Content-Type"
    value: "application/json"
authentication:
  type: "bearer"
  token: "{{ _.token }}"
metaSortKey: 2000
isPrivate: false
pathParameters: []
settingStoreCookies: true
settingSendCookies: true
settingDisableRenderRequestBody: false
settingEncodeUrl: true
settingRebuildPath: true
settingFollowRedirects: "global"
afterResponseScript: |-
  insomnia.test('Status 200', () => {
    insomnia.expect(insomnia.response.code).to.equal(200);
  });
  if (insomnia.response.code === 200) {
    const corpo = insomnia.response.json();
    insomnia.environment.set('usuario_id_exemplo', corpo.id);
  }
