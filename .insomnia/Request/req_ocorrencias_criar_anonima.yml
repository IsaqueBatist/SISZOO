body:
  mimeType: "application/json"
  text: |-
    {
      "tipoOcorrencia": "agressivo",
      "dataAbertura": "2026-10-01",
      "horaAbertura": "09:30",
      "endereco": "Rua Fictícia, 100",
      "bairro": "Vila Progresso",
      "pontoReferencia": "Próximo à praça",
      "descricao": "Ocorrência anônima fictícia criada pela coleção do Insomnia.",
      "urgente": false,
      "sigilosa": false,
      "anonima": true,
      "denunciante": null
    }
parameters: []
headers:
  - name: "Content-Type"
    value: "application/json"
authentication:
  type: "bearer"
  token: "{{ _.token }}"
metaSortKey: 3000
isPrivate: false
pathParameters: []
settingStoreCookies: true
settingSendCookies: true
settingDisableRenderRequestBody: false
settingEncodeUrl: true
settingRebuildPath: true
settingFollowRedirects: "global"
afterResponseScript: |-
  insomnia.test('Status 200', () => {
    insomnia.expect(insomnia.response.code).to.equal(200);
