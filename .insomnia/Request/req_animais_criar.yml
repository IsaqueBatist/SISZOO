_id: "req_animais_criar"
type: "Request"
parentId: "fld_animais"
modified: 1750000000000
created: 1750000000000
url: "{{ _.base_url }}/api/animais"
name: "Criar animal - caso feliz"
description: "Requer GESTAO_ANIMAIS:escrita (Administrador ou Veterinário). O microchip leva o sufixo da execução ({{ _.execucao }}, gerado no login), então a sequência pode ser repetida. A regra de microchip único (409) é demonstrada pela suíte ut_animais_criar_409_microchip_duplicado. O id fica em {{ _.animal_id_exemplo }}."
method: "POST"
body:
  mimeType: "application/json"
  text: |-
    {
      "nome": "Rex",
      "especie": "canino",
      "sexo": "macho",
      "raca": "Vira-lata",
      "coloracao": "Caramelo",
      "pelagem": "curta",
      "porte": "medio",
      "pesoKg": 12.5,
      "idadeAprox": "2 anos",
      "microchip": "CHIP-EXEMPLO-{{ _.execucao }}",
      "esterilizado": true,
      "status": "disponivel_adocao",
      "motivoEntrada": "recolhimento",
      "dataEntrada": "2026-08-30T09:00:00",
      "observacoes": "Cadastro de exemplo para documentação da API."
    }
parameters: []
headers:
  - name: "Content-Type"
    value: "application/json"
authentication:
  type: "bearer"
  token: "{{ _.token }}"
metaSortKey: 1000
isPrivate: false
pathParameters: []
settingStoreCookies: true
settingSendCookies: true
settingDisableRenderRequestBody: false
settingEncodeUrl: true
settingRebuildPath: true
settingFollowRedirects: "global"
afterResponseScript: |-
  insomnia.test('Status 200', () => {
    insomnia.expect(insomnia.response.code).to.equal(200);
  });
  if (insomnia.response.code === 200) {
    const corpo = insomnia.response.json();
    insomnia.environment.set('animal_id_exemplo', corpo.id);
  }
