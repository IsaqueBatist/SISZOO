    {
      "nome": "Gil",
      "sobrenome": "Teste",
      "email": "gil.{{ _.execucao_letras }}@itu.sp.gov.br",
      "cargo": "Agente Sanitário",
      "telefone": "(11) 90000-0004",
      "senhaInicial": "{{ _.senha_teste_padrao }}"
    }
parameters: []
headers:
  - name: "Content-Type"
    value: "application/json"
authentication:
  type: "bearer"
  token: "{{ _.token }}"
